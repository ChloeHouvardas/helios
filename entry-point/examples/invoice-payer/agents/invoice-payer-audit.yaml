# Audit manifest: Invoice Payer (entry-point worked example)
#
# Generated by Qwen from the user's idea: "Make me an app that automatically
# manages and pays my invoices."
#
# THIS FILE IS THE AUDIT AGENT. There is no Python policy here — every control
# below is data that `build_audit_agent()` compiles into deterministic rules.
#
# Two things make this example worth reading:
#
#   1. The tool names are the REAL financial-tool names from
#      platform/financial-tools (`payments.send`, `email.send`,
#      `payments.balance`). This app's action agent calls those tools directly,
#      so the audit manifest governs actual platform capability rather than
#      mock names. See examples/invoice-payer/app.py.
#
#   2. Every safety-critical value is a FACT, not an argument. The agent picks
#      the amount it wants to pay; the ceiling it is measured against comes from
#      the trusted fact source (the app's own invoice table). An agent cannot
#      raise its own ceiling by editing the request.

manifest_version: "1"
app_id: invoice-payer
name: Invoice Payer Audit Agent
description: >
  Governs an action agent that pays supplier invoices. Reading balances and
  invoices is free. Moving money is gated per call, must carry a human-verified
  intent code, may not exceed the recorded invoice amount, is refused outright
  when the supplier's payment details changed, and is held for the owner on
  large amounts and duplicate-looking invoices.

tools:
  # --- read-only: these run directly, no gate -------------------------------
  - name: payments.balance
    description: Read an account balance in integer cents. Read-only.
    side_effect: false

  - name: lookup_invoice
    description: >
      Look up one supplier invoice and the supplier it belongs to. Read-only.
      The agent must call this before proposing payment so it never invents
      invoice details.
    side_effect: false
    input_schema:
      type: object
      additionalProperties: false
      required: [invoice_id]
      properties:
        invoice_id: { type: string, minLength: 1 }

  # --- side-effecting: every call becomes a gated proposal ------------------
  - name: payments.send
    description: >
      Send money to a supplier. Irreversible once executed, so every call is
      gated and logged with amount and payee. Requires an auth_code produced by
      the Intent Verification service — i.e. a human confirmed this exact
      payment out of band.
    side_effect: true
    input_schema:
      type: object
      additionalProperties: false
      required: [payer, payee, amount_cents, currency, auth_code]
      properties:
        payer: { type: string, minLength: 1 }
        payee: { type: string, minLength: 1 }
        amount_cents:
          type: integer
          minimum: 1
          description: Integer cents. Money is never a float.
        currency:
          type: string
          enum: [USD, EUR, CNY, GBP]
        auth_code:
          type: string
          # No minLength here on purpose. `auth_code` is a payment credential,
          # so the audit agent redacts its VALUE to ***REDACTED*** at request
          # ingestion (audit_agent.contracts.REDACTED_KEYS) — it never sees the
          # real code, and a length/pattern check could only ever validate the
          # placeholder. Presence is what this gate enforces (required above +
          # the critical app.requires_verified_intent rule); VALIDITY is checked
          # by the payments.send tool at execution time, which receives the
          # real argument. A format check on a secret the gate refuses to read
          # is not a control, so it is not declared.
          description: Verified intent code bound to (amount, currency, payee)
        idempotency_key: { type: string, maxLength: 64 }
        memo: { type: string, maxLength: 200 }

  - name: email.send
    description: >
      Send an email to a supplier contact. Side-effecting because it is visible
      to a human outside the system.
    side_effect: true
    input_schema:
      type: object
      additionalProperties: false
      required: [to, subject, body]
      properties:
        to: { type: string, minLength: 3 }
        subject: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 4000 }

tasks:
  payables.pay_invoice:
    description: Pay a supplier invoice that is due, and notify the supplier
    allowed_tools: [payments.balance, lookup_invoice, payments.send, email.send]
    # Money movement gets a short grant lifetime: long enough to complete one
    # payment, not long enough to sit around unused.
    ttl_seconds: 120
    tool_overrides:
      # A reminder email is cheap; a storm of them is not. Three per grant.
      email.send:
        max_calls: 3
        condition: at most three supplier notifications per authorisation

rules:
  # --- 1. No payment without a human-confirmed intent -----------------------
  # `auth_code` is required, so a payment the owner never confirmed fails
  # closed at argument validation before any money moves. This is how the
  # Intent Verification capability is enforced by policy data rather than by
  # hoping the agent remembers to call it.
  - id: app.requires_verified_intent
    description: A payment must carry a verified intent auth code
    task_types: [payables.pay_invoice]
    tools: [payments.send]
    message: >
      a payment needs an auth_code from a human-confirmed intent; capture and
      confirm the intent first
    required_arguments: [payer, payee, amount_cents, currency, auth_code]
    severity: critical

  # --- 2. The payment may not exceed the recorded invoice -------------------
  # The shape that matters most in payables. The AGENT chooses `amount_cents`;
  # the CEILING (`invoice_amount_cents`) is resolved from the trusted fact
  # source. Neither side of the comparison is under the agent's control, so it
  # cannot overpay by editing arguments and cannot shrink the invoice either.
  - id: app.amount_matches_invoice
    description: The payment may not exceed the recorded invoice amount
    task_types: [payables.pay_invoice]
    tools: [payments.send]
    message: the payment exceeds the recorded invoice amount
    limits:
      - argument: amount_cents
        max_from_fact: invoice_amount_cents
        on_exceed: hold
    severity: critical

  # --- 3. Owner approval above a fixed ceiling ------------------------------
  # Even when the amount matches the invoice exactly, a large payment is a
  # decision a human should make. Cents: 2,500,000 = $25,000.
  - id: app.large_payment_approval
    description: Owner approval for payments over 25,000
    task_types: [payables.pay_invoice]
    tools: [payments.send]
    message: payments over 25,000 need owner approval
    limits:
      - argument: amount_cents
        max: 2500000
        on_exceed: hold

  # --- 4. Changed supplier payment details: DENY, not hold ------------------
  # The classic fraud vector. This is a refusal, not a queue item: the agent
  # must not proceed at all until a human re-verifies the payee out of band.
  # `payment_details_changed` is a fact, so an agent cannot omit it.
  - id: app.payee_details_changed
    description: Never pay a supplier whose payment details recently changed
    task_types: [payables.pay_invoice]
    tools: [payments.send]
    message: >
      this supplier's payment details changed recently; payment is refused until
      the owner re-verifies the payee
    deny_if_fact_true: [payment_details_changed]
    severity: critical

  # --- 5. Duplicate-looking invoice: HOLD -----------------------------------
  # Held rather than denied because it may be legitimate (two genuine invoices
  # for the same amount and PO). Only the owner can tell.
  - id: app.duplicate_invoice
    description: Hold duplicate-looking invoices for owner verification
    task_types: [payables.pay_invoice]
    tools: [payments.send]
    message: this invoice looks like a duplicate; the owner must verify it
    approval_if_fact_true: [duplicate_invoice]

  # --- 6. Notifications must be identifiable --------------------------------
  - id: app.notify_is_identifiable
    description: A supplier notification must state who it is to and why
    task_types: [payables.pay_invoice]
    tools: [email.send]
    message: a supplier notification needs a recipient, subject and body
    required_arguments: [to, subject, body]

settings:
  default_ttl_seconds: 120
  contact_window_days: 30
  log_path: invoice-payer-audit-log.jsonl
  # `heuristic` is deterministic and always available. Adding `qwen` appends
  # model commentary for the human reviewer; it can never change a verdict.
  advisory: [heuristic]
  allow_unsigned_grants: false
