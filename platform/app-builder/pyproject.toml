[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app-builder"
version = "0.1.0"
description = "Helios Application Builder: turns a helios-app.yaml spec into a complete, validator-clean application skeleton"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
helios-app = "app_builder.cli:main"

[tool.hatch.build.targets.wheel]
# Everything under src/app_builder ships in the wheel, including the kit's Jinja2
# templates, CSS tokens and the vendored htmx.min.js. Non-Python files inside the
# declared package directory are copied by default.
packages = ["src/app_builder"]

# stacks.yaml deliberately lives at platform/app-builder/stacks.yaml in the repo —
# outside the package, where a reader browsing the tree can find it. Copy it into
# the wheel next to the module that reads it, so an INSTALLED (non-editable)
# app-builder still works. An editable install hides this: the source tree is the
# install, so a repo-relative path appears to work everywhere and breaks the moment
# someone pip-installs the wheel.
[tool.hatch.build.targets.wheel.force-include]
"stacks.yaml" = "app_builder/stacks.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
