[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app-builder"
version = "0.1.0"
description = "Helios Application Builder: turns a helios-app.yaml spec into a complete, validator-clean application skeleton"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
helios-app = "app_builder.cli:main"

[tool.hatch.build.targets.wheel]
# Everything under src/app_builder ships in the wheel, including the kit's
# Jinja2 templates, CSS tokens and the vendored htmx.min.js. No force-include is
# needed: hatchling copies non-Python files from the declared package directory by
# default. (An explicit force-include of `kit` was tried and removed — it fails the
# build when that directory does not exist yet, which is exactly the state of a
# fresh checkout between tasks.)
packages = ["src/app_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
