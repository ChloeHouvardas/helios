[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-tools"
version = "0.1.0"
description = "Helios Financial Tools Developer Interface — offline prototypes (payments, email, spreadsheets, simulation, intent verification, knowledge graph, forecasting)"
requires-python = ">=3.10"
dependencies = [
    # helios_forecast projects cash-flow paths with Monte Carlo simulation.
    "numpy>=1.26",
    # spreadsheets reads and writes .xlsx workbooks (engine.py, parsing.py).
    "openpyxl>=3.1",
    # spreadsheets/app.py is a FastAPI service; the tests build workbooks and
    # drive the engine directly, but importing the package pulls app.py in.
    "fastapi>=0.115",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    # email_tool renders Jinja2 templates and validates requests/responses
    # against the JSON Schemas it ships.
    "jinja2>=3.1",
    "jsonschema>=4.21",
    # payments_collect models default to Asia/Shanghai via zoneinfo, resolved
    # at import time (models.py: SHANGHAI = ZoneInfo("Asia/Shanghai")). tzdata
    # is the IANA database fallback for hosts with no system zoneinfo (slim
    # containers, Windows). Cheap insurance for an import-time constant.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# The upstream branch declared pandas + rapidfuzz here for `import_sheet` and
# `reconcile`. Neither is imported by any file in this package as imported, so
# they are not pulled into the base install. Kept as an extra so the upstream
# intent is recorded rather than silently dropped.
import = [
    "pandas>=2.2",
    "rapidfuzz>=3.6",
]
dev = ["pytest>=8"]

# `fin_tools` is a flat-layout package with non-package siblings (`tests/`,
# `fixtures/`, `research/`). Setuptools' automatic flat-layout discovery refuses
# to guess in that situation, so the package list is stated explicitly.
#
# The sibling tool packages imported from teammates' work live alongside
# `fin_tools` in this same directory and are installed by the same pyproject,
# so they are listed here too. `spreadsheets` has a `dev/` subpackage.
[tool.setuptools]
packages = [
    "fin_tools",
    "helios_forecast",
    "spreadsheets",
    "spreadsheets.dev",
    "email_tool",
    "payments_collect",
]

# email_tool loads its JSON Schemas and Jinja2/markdown templates from paths
# relative to the package (tool.py SCHEMAS_DIR, templates.py
# DEFAULT_TEMPLATES_DIR), so they ship with it rather than being data files
# that happen to sit nearby.
[tool.setuptools.package-data]
email_tool = ["schemas/*.json", "templates/*.md", "templates/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
