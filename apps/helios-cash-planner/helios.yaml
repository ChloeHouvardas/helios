# Deployment manifest for the Helios engine (platform/deployment).
#
# Generated by `helios-app new`, then edited: the permission families are the
# platform tools this app's own tools wrap (forecast, market data, the graph,
# email, the event bus), which the scaffolder cannot infer from app-local names.
name: helios-cash-planner
tenant: ''
entry: server:app
port: 3000
permissions:
  - forecast
  - market-data
  - knowledge-graph
  - email
  - events
audit_manifest: agents/helios-cash-planner-audit.yaml
data_dir: /data
env:
  - HELIOS_AUDIT_SIGNING_KEY
  - DASHSCOPE_API_KEY
  - HELIOS_MARKET_MODE
  - TUSHARE_TOKEN
